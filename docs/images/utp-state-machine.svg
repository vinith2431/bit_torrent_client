<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="box-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="box-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="box-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="box-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#da3633" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <marker id="m-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="m-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="m-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="40" text-anchor="middle" fill="#58a6ff" font-size="20" font-weight="700" letter-spacing="1">μTP PROTOCOL STATE MACHINE &amp; PACKET FLOW</text>
  <text x="475" y="65" text-anchor="middle" fill="#8b949e" font-size="13">Reliable Ordered Transport over UDP (BEP 29 / RFC 6817)</text>

  <!-- State: CLOSED (Start) -->
  <g transform="translate(60, 190)" filter="url(#box-shadow)">
    <rect width="140" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="70" y="32" text-anchor="middle" fill="#8b949e" font-size="15" font-weight="700">CLOSED</text>
    <text x="70" y="52" text-anchor="middle" fill="#6e7681" font-size="11">Initial State</text>
  </g>

  <!-- Arrow: CLOSED -> SYN_SENT -->
  <path d="M 200 225 L 290 225" stroke="#58a6ff" stroke-width="2" marker-end="url(#m-arrow)"/>
  <text x="245" y="215" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">Send ST_SYN</text>
  <text x="245" y="245" text-anchor="middle" fill="#8b949e" font-size="10">seq=1, connID</text>

  <!-- State: SYN_SENT -->
  <g transform="translate(290, 190)" filter="url(#box-shadow)">
    <rect width="150" height="70" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
    <rect width="150" height="70" rx="8" fill="url(#box-blue)"/>
    <text x="75" y="32" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">SYN_SENT</text>
    <text x="75" y="52" text-anchor="middle" fill="#8b949e" font-size="11">Awaiting Handshake</text>
  </g>

  <!-- Arrow: SYN_SENT -> ESTABLISHED -->
  <path d="M 440 225 L 530 225" stroke="#3fb950" stroke-width="2" marker-end="url(#m-arrow-green)"/>
  <text x="485" y="215" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">Recv ST_STATE</text>
  <text x="485" y="245" text-anchor="middle" fill="#8b949e" font-size="10">WindowSize, ack=1</text>

  <!-- State: ESTABLISHED / DATA TRANSFER -->
  <g transform="translate(530, 150)" filter="url(#box-shadow)">
    <rect width="200" height="150" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <rect width="200" height="150" rx="10" fill="url(#box-green)"/>
    <text x="100" y="30" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">ESTABLISHED</text>
    <text x="100" y="52" text-anchor="middle" fill="#c9d1d9" font-size="11">Bidirectional Data Stream</text>
    
    <line x1="20" y1="62" x2="180" y2="62" stroke="#30363d" stroke-width="1"/>
    
    <text x="100" y="80" text-anchor="middle" fill="#8b949e" font-size="10.5">• ST_DATA ⇄ ST_STATE (ACK)</text>
    <text x="100" y="98" text-anchor="middle" fill="#8b949e" font-size="10.5">• Out-of-Order Buffer Flush</text>
    <text x="100" y="116" text-anchor="middle" fill="#8b949e" font-size="10.5">• Karn / Jacobson RTT/RTO</text>
    <text x="100" y="134" text-anchor="middle" fill="#8b949e" font-size="10.5">• AIMD / Slow-Start CWND</text>
  </g>

  <!-- Arrow: ESTABLISHED -> CLOSING -->
  <path d="M 730 225 L 810 225" stroke="#f85149" stroke-width="2" marker-end="url(#m-arrow-red)"/>
  <text x="770" y="215" text-anchor="middle" fill="#f85149" font-size="11" font-weight="600">Send ST_FIN</text>

  <!-- State: CLOSING / CLOSED -->
  <g transform="translate(810, 190)" filter="url(#box-shadow)">
    <rect width="110" height="70" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <rect width="110" height="70" rx="8" fill="url(#box-red)"/>
    <text x="55" y="32" text-anchor="middle" fill="#f85149" font-size="14" font-weight="700">CLOSING</text>
    <text x="55" y="52" text-anchor="middle" fill="#8b949e" font-size="11">RST / FIN-ACK</text>
  </g>

  <!-- Lower Loop: TCP Fallback -->
  <g transform="translate(260, 360)" filter="url(#box-shadow)">
    <rect width="450" height="85" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="450" height="85" rx="8" fill="url(#box-purple)"/>
    <text x="225" y="25" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="600">Adaptive Fallback Engine (dial_with_fallback)</text>
    <text x="225" y="48" text-anchor="middle" fill="#c9d1d9" font-size="11">If UDP SYN handshake receives no STATE reply within timeout:</text>
    <text x="225" y="68" text-anchor="middle" fill="#79c0ff" font-size="11">Automatic seamless fallback dials peer over standard TCP socket</text>
  </g>

  <path d="M 365 260 L 365 360" stroke="#8957e5" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#m-arrow)"/>
  <text x="355" y="320" text-anchor="end" fill="#d2a8ff" font-size="10">SYN Timeout</text>
</svg>
