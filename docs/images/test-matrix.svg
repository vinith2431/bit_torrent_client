<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="tm-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="tm-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <g transform="translate(30, 25)" filter="url(#tm-shadow)">
    <rect width="890" height="370" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="890" height="42" rx="10" fill="#21262d"/>
    <circle cx="25" cy="21" r="5.5" fill="#f85149"/>
    <circle cx="42" cy="21" r="5.5" fill="#e3b341"/>
    <circle cx="59" cy="21" r="5.5" fill="#2ea043"/>
    <text x="445" y="26" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="600">μTP &amp; BITTORRENT PROTOCOL TEST CENTER • 42 / 42 TESTS PASSING</text>
    
    <!-- Left Column (Phases 1-7) -->
    <g transform="translate(40, 65)">
      <text x="0" y="20" fill="#79c0ff" font-size="12" font-weight="600">PHASE 1-7 : μTP CORE PROTOCOL</text>
      
      <text x="0" y="45" fill="#c9d1d9" font-size="11.5">ACK Tracking &amp; Wraparound</text>
      <text x="280" y="45" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.01s)</text>
      
      <text x="0" y="70" fill="#c9d1d9" font-size="11.5">Packet Ordering &amp; Reassembly</text>
      <text x="280" y="70" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.01s)</text>
      
      <text x="0" y="95" fill="#c9d1d9" font-size="11.5">Retransmission &amp; Max Retries</text>
      <text x="280" y="95" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.02s)</text>
      
      <text x="0" y="120" fill="#c9d1d9" font-size="11.5">Adaptive RTO (Jacobson / Karn)</text>
      <text x="280" y="120" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.01s)</text>
      
      <text x="0" y="145" fill="#c9d1d9" font-size="11.5">Flow Control &amp; Window Clamping</text>
      <text x="280" y="145" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.05s)</text>
      
      <text x="0" y="170" fill="#c9d1d9" font-size="11.5">Congestion Control (Slow-Start / CA)</text>
      <text x="280" y="170" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.01s)</text>
      
      <text x="0" y="195" fill="#c9d1d9" font-size="11.5">Graceful FIN &amp; RST Termination</text>
      <text x="280" y="195" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.01s)</text>
    </g>

    <!-- Vertical Divider -->
    <line x1="450" y1="65" x2="450" y2="280" stroke="#30363d" stroke-width="1"/>

    <!-- Right Column (Phases 8-14 & Security) -->
    <g transform="translate(480, 65)">
      <text x="0" y="20" fill="#d2a8ff" font-size="12" font-weight="600">PHASE 8-14 : ROBUSTNESS &amp; SYSTEM TESTS</text>
      
      <text x="0" y="45" fill="#c9d1d9" font-size="11.5">Transport Fallback (μTP → TCP)</text>
      <text x="280" y="45" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (3.00s)</text>
      
      <text x="0" y="70" fill="#c9d1d9" font-size="11.5">Network Loss Impairment (0-20%)</text>
      <text x="280" y="70" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (2.50s)</text>
      
      <text x="0" y="95" fill="#c9d1d9" font-size="11.5">Scrambled Sequence (3-1-5-2-4)</text>
      <text x="280" y="95" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.01s)</text>
      
      <text x="0" y="120" fill="#c9d1d9" font-size="11.5">Full UDP Bidirectional Stream</text>
      <text x="280" y="120" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.02s)</text>
      
      <text x="0" y="145" fill="#c9d1d9" font-size="11.5">Packet Security Bounds (64KB/4MB)</text>
      <text x="280" y="145" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (0.01s)</text>
      
      <text x="0" y="170" fill="#c9d1d9" font-size="11.5">Fuzz Testing (750,000+ Packets)</text>
      <text x="280" y="170" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (5.00s)</text>
      
      <text x="0" y="195" fill="#c9d1d9" font-size="11.5">Multi-Peer End-to-End Download</text>
      <text x="280" y="195" fill="#3fb950" font-size="11" font-weight="700">✓ PASS (1.02s)</text>
    </g>

    <!-- Bottom Summary Banner -->
    <rect x="25" y="295" width="840" height="55" rx="6" fill="url(#tm-card)" stroke="#238636" stroke-width="1"/>
    <text x="445" y="322" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">ALL 42 SPECIFICATION &amp; SECURITY TESTS VERIFIED</text>
    <text x="445" y="340" text-anchor="middle" fill="#8b949e" font-size="11">Zero Memory Leaks • Zero Goroutine Leaks • Complete Protocol Integrity</text>
  </g>
</svg>
